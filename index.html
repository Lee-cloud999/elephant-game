<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6FF">
<title>코순이 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 게임: 위에 이름·코인·성장, 가운데 마당 장면, 아래에 행동 버튼 */
:root{
  --ink:#34406A; --ink-soft:#66719A; --paper:#F2F6FF; --card:#FFFFFF;
  --ele:#B9C6EE; --ele-deep:#8FA1D8; --ele-ear:#F6B9CC; --belly:#D7DFF7;
  --coral:#E8603F; --coral-edge:#B8452A; --sun:#FFD166;
  --hunger:#FFB547; --thirst:#4C7DF0; --clean:#5EBBF0; --happy:#FF7FA5; --energy:#7FCB6F;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding-inline:16px; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; font-weight:400;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
button,input{font-family:var(--font-display); font-weight:400; color:inherit}
b{font-weight:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #5B7CFA; outline-offset:2px}

.app{max-width:520px; height:100%; margin:0 auto; display:flex; flex-direction:column; gap:10px; padding-block:10px}

/* 윗줄 */
.top{display:flex; align-items:center; gap:10px}
.namebtn{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; background:none; border:0; padding:4px 0; text-align:left; cursor:pointer}
#nameText{font-size:26px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#stageText{font-size:14px; color:var(--ink-soft); white-space:nowrap; font-family:var(--font-body)}
.chip{display:flex; align-items:center; gap:6px; padding:5px 13px 5px 8px; border-radius:999px; background:#FFF0BF; color:#6E5200; font-size:19px; font-variant-numeric:tabular-nums}
.ico{width:22px; height:22px; flex:none}
.iconbtn{width:40px; height:40px; border-radius:50%; border:0; background:#E3E9FA; display:grid; place-items:center; cursor:pointer}
.iconbtn .ico{width:24px; height:24px}

/* 성장 막대 */
.growth{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft)}
.bar{flex:1; height:10px; border-radius:99px; background:#E1E7F7; overflow:hidden}
.bar i{display:block; height:100%; width:0; border-radius:inherit; transition:width .6s ease}
#xpFill{background:linear-gradient(90deg,#9FB3F0,#7A91E6)}
#xpText{white-space:nowrap; font-family:var(--font-display); font-size:13px}

/* 상태 4개 */
.stats{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.stat{min-width:0; display:flex; flex-direction:column; gap:5px}
.lab{display:flex; align-items:center; gap:3px; font-family:var(--font-display); font-size:12.5px; white-space:nowrap}
.lab svg{width:16px; height:16px; flex:none}
.stat .bar{flex:none; height:9px}
.stat .bar i{background:var(--c)}
.stat.low .bar i{background:#FF5F4D; animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* 마당 장면 */
.scene{
  --sky-a:#BDE5F7; --sky-b:#E6F7FA; --hill:#B7E2A3; --ground:#A5DA8F; --ground-deep:#8FCD7B; --cloud:#FFFFFF; --tree:#7CC479; --trunk:#A68461;
  position:relative; flex:1; min-height:200px; border-radius:28px; overflow:hidden; background:var(--sky-a);
}
.scene.night{--sky-a:#1E2958; --sky-b:#4D5B9A; --hill:#34607A; --ground:#3B6B5F; --ground-deep:#2F5A50; --cloud:#6B7AB3; --tree:#2D6A57; --trunk:#5A4A44}
#world{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible}
.sky{fill:url(#skyG)} .hill{fill:var(--hill)} .ground{fill:var(--ground)} .ground-deep{fill:var(--ground-deep)}
.cloudp{fill:var(--cloud)} .treec{fill:var(--tree)} .treet{fill:var(--trunk)}
.sun,.moon,.stars{transition:opacity 1s}
.moon,.stars{opacity:0}
.scene.night .moon,.scene.night .stars{opacity:1}
.scene.night .sun{opacity:0}
.stars circle{fill:#FFF6C9; animation:tw 3s ease-in-out infinite}
.stars circle:nth-child(2n){animation-delay:.8s} .stars circle:nth-child(3n){animation-delay:1.6s}
@keyframes tw{50%{opacity:.25}}
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:95s; animation-delay:-40s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.dim{fill:#0A0F33; opacity:0; transition:opacity 1s; pointer-events:none}
.scene.sleeping .dim{opacity:.35}

.bubble{
  position:absolute; left:50%; top:12px; transform:translate(-50%,-8px); max-width:calc(100% - 32px);
  padding:9px 16px; border-radius:18px; background:#fff; color:var(--ink);
  font-family:var(--font-display); font-size:16px; line-height:1.35; text-align:center;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 4px 0 rgba(52,64,106,.14);
}
.bubble.show{opacity:1; transform:translate(-50%,0)}
.scene.editing .bubble{opacity:0!important; visibility:hidden}

/* 코끼리 (그림 3장: 기본, 시무룩, 잠자는 중) */
.shadow{fill:rgba(20,30,60,.16)}
#eleWrap{transform:translate(200px,306px) scale(var(--s,.64)); transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
#hop{cursor:pointer}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.sleeping .breathe{animation-duration:5.5s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.pose{display:none}
#ele[data-pose="idle"] .p-idle{display:inline}
#ele[data-pose="sad"] .p-sad{display:inline}
#ele[data-pose="sleep"] .p-sleep{display:inline}
#ele[data-pose="eat"] .p-eat{display:inline}
#ele[data-pose="angry"] .p-angry{display:inline}
#ele[data-pose="joy"] .p-joy{display:inline}
#ele[data-pose="surprise"] .p-surprise{display:inline}

/* 먹이 고르기 */
.tray{display:flex; flex-direction:column; gap:6px}
.trayrow{display:flex; gap:6px}
.food{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 2px 5px; border-radius:16px; border:2px dashed #F0C27E; background:#FFF5DF; font-size:14px; cursor:pointer}
.food svg{width:28px; height:28px; flex:none}
.food:active{background:#FFE9BB}
.food.drink{border-color:#9CCBF0; background:#E8F4FD}
.food.drink:active{background:#CFE8FA}
.food.veg{border-color:#A9D6A0; background:#EEF8EA}
.food.veg:active{background:#DDF0D6}

/* 행동 버튼 */
.actions{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.act{
  min-width:0; border:0; border-radius:20px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--bg); color:var(--fg); font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--edge);
  transition:transform .08s, box-shadow .08s;
}
.act:active{transform:translateY(4px); box-shadow:0 0 0 var(--edge)}
.act svg{width:28px; height:28px}
.act{position:relative}
#hospBtn.alert::after{content:''; position:absolute; top:6px; right:10px; width:12px; height:12px; border-radius:50%; background:#E5484D; box-shadow:0 0 0 3px #FFE0E0; animation:pulse 1s ease-in-out infinite}
#stageText.sick{color:#C9402F}
.scene{touch-action:none}
.deco{transition:opacity .6s}
.walking .deco,.hospital .deco,.schooling .deco{opacity:0}
#hosp,#walkG,#school{opacity:0; transition:opacity .7s; pointer-events:none}
.hospital #hosp,.walking #walkG,.schooling #school{opacity:1}
.actions.five{grid-template-columns:repeat(5,1fr)}
.actions.five .act{font-size:14px}
.walking #strip{animation:scrollx 2.4s linear infinite}
@keyframes scrollx{to{transform:translateX(-400px)}}
#docArm{transform-origin:-36px -98px; animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(18deg)}}
#doc{animation:docbob 2.4s ease-in-out infinite}
@keyframes docbob{50%{transform:translate(322px,296px) scale(.8,.79)}}

/* 팝업 */
.wrap{position:fixed; inset:0; z-index:10; background:rgba(36,46,92,.5); display:flex; padding:16px}
.wrap.center{align-items:center; justify-content:center}
.wrap.bottom{align-items:flex-end; justify-content:center; padding:0}
.card{width:100%; max-width:360px; background:#fff; border-radius:28px; padding:22px 20px; display:flex; flex-direction:column; gap:14px; text-align:center}
.card h2,.sheet h2{margin:0; font-weight:400; font-size:24px}
.card p{margin:0; color:var(--ink-soft); line-height:1.5}
#nameInput{width:100%; font-size:24px; text-align:center; padding:12px; border:3px solid #C9D5F6; border-radius:18px; background:#F6F8FF; -webkit-user-select:text; user-select:text}
.go{border:0; border-radius:20px; padding:14px; background:var(--coral); color:#fff; font-size:20px; box-shadow:0 4px 0 var(--coral-edge); cursor:pointer}
.go:active{transform:translateY(4px); box-shadow:none}
.ghost{border:0; background:none; padding:8px; font-size:16px; color:var(--ink-soft); cursor:pointer}
.sheet{width:100%; max-width:520px; max-height:82%; overflow:auto; background:#fff; border-radius:28px 28px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px}
.sheet-head{display:flex; align-items:center; gap:10px}
.sheet-head h2{flex:1}
.row{display:flex; align-items:center; gap:12px; padding:8px; border-radius:18px; background:#F5F8FF}
.prev{width:60px; height:60px; flex:none; border-radius:16px; background:#E8EEFF}
.row .meta{flex:1; min-width:0; font-family:var(--font-display); font-size:18px}
.buy{min-width:84px; display:flex; align-items:center; justify-content:center; gap:5px; border:0; border-radius:16px; padding:10px 12px; background:#FFE08A; color:#5E4600; font-size:17px; cursor:pointer; font-variant-numeric:tabular-nums}
.buy.on{background:#CDEBD2; color:#1E5A32}
.srow{display:flex; align-items:center; gap:10px}
.slab{flex:1; display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:19px}
.slab svg{width:26px; height:26px; flex:none}
.sw{width:58px; height:34px; border-radius:99px; border:0; background:#CBD3EA; position:relative; cursor:pointer; flex:none; transition:background .2s}
.sw::after{content:''; position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 0 rgba(52,64,106,.2); transition:transform .2s}
.sw[aria-checked="true"]{background:#5BBE72}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.vol{display:flex; align-items:center; gap:10px}
.vol input{flex:1; min-width:0; height:36px; accent-color:#6B86E8}
.vol b{min-width:46px; text-align:right; font-family:var(--font-display); font-size:16px; color:var(--ink-soft)}
.sgroup{display:flex; flex-direction:column; gap:6px; padding:12px 14px; border-radius:20px; background:#F5F8FF}
.sgroup.off .vol{opacity:.45}
.gacha{display:flex; align-items:center; gap:12px; padding:10px; border-radius:20px; background:linear-gradient(135deg,#FFF3C9,#FFE0EC)}
.gstage{width:104px; height:104px; flex:none; position:relative; border-radius:18px; background:rgba(255,255,255,.7); overflow:hidden}
.gstage>svg{position:absolute; inset:0; width:100%; height:100%}
.gside{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0}
.gmsg{font-size:15px; line-height:1.35; color:var(--ink); min-height:40px}
.gmsg small{display:block; color:var(--ink-soft); font-size:12px}
.gbtn{align-self:flex-start; background:#FF8FB1; color:#fff}
.gbtn:disabled{background:#E7E9F2; color:#9AA2BE}
.rar{display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; margin-right:4px; color:#fff}
.rar.r0{background:#9AA2BE}.rar.r1{background:#6B86E8}.rar.r2{background:#E8A200}
.rar.r3{background:linear-gradient(90deg,#FF6F91,#FFB300,#5EBBF0,#B455FF)}
.gstage.t2{box-shadow:0 0 0 3px #FFD54F inset,0 0 18px #FFD54F; animation:glow 1.1s ease-in-out 3}
.gstage.t3{box-shadow:0 0 0 3px #D58BFF inset,0 0 22px #B455FF; animation:glow 0.8s ease-in-out 5}
@keyframes glow{50%{filter:brightness(1.25)}}
.odds{display:block; color:var(--ink-soft); font-size:12px}
.row.lockd .prev,.row.lockd .meta{opacity:.5}
.row .meta .rar{margin:0 0 0 6px; vertical-align:middle}
.wrap.pass{background:none; pointer-events:none}
.wrap.pass .sheet{pointer-events:auto; max-height:none; border-radius:24px 24px 0 0; box-shadow:0 -6px 24px rgba(36,46,92,.25); gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chipb{border:2px solid transparent; background:#EEF2FF; border-radius:14px; padding:7px 12px; font-size:15px; cursor:pointer; color:var(--ink)}
.chipb.on{border-color:#6B86E8; background:#E8EEFF; font-weight:700}
.sizerow{display:flex; align-items:center; gap:8px}
.sizerow .zb{width:48px; height:48px; border:0; border-radius:16px; background:#FFE08A; color:#5E4600; font-size:26px; line-height:1; cursor:pointer}
.sizerow .zb:disabled{background:#E7E9F2; color:#9AA2BE}
.sizerow .pct{flex:1; text-align:center; font-size:18px; font-variant-numeric:tabular-nums}
.sizerow .rst{border:0; border-radius:14px; background:#EEF2FF; padding:12px 12px; font-size:15px; cursor:pointer; color:var(--ink)}
.edbtns{display:flex; gap:8px}
.edbtns button{flex:1; border:0; border-radius:16px; padding:13px; font-size:17px; cursor:pointer}
.edbtns .sv{background:#6B86E8; color:#fff}
.edbtns .cx{background:#EEF2FF; color:var(--ink)}
.edhint{font-size:13px; color:var(--ink-soft); text-align:center}
.scene.editing{cursor:grab; outline:3px dashed #6B86E8; outline-offset:-3px}
.lv{font-weight:700; color:#4A5FB8; background:#E3E9FA; border-radius:10px; padding:2px 8px; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums}
.lv.max{background:#FFE08A; color:#6E5200}
.mini{border:0; border-radius:12px; padding:6px 11px; font-size:13px; background:#E3E9FA; color:#3B4A8F; cursor:pointer; white-space:nowrap}
.mini.hot{background:#FF8FB1; color:#fff; font-weight:700; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.herd{display:flex; flex-direction:column; gap:8px}
.hrow{display:flex; align-items:center; gap:12px; padding:8px; border-radius:18px; background:#F5F8FF}
.hrow.now{background:#FFF6D6}
.hth{width:72px; height:72px; flex:none; border-radius:16px; background:#E8EEFF; overflow:hidden}
.hth svg{width:100%; height:100%; display:block}
.hmeta{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.hmeta b{font-weight:400; font-size:19px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hbtns{display:flex; flex-direction:column; gap:5px; flex:none}
.hb{border:0; border-radius:12px; padding:7px 10px; font-size:13px; cursor:pointer; background:#E3E9FA; color:#3B4A8F; white-space:nowrap}
.hb.on{background:#CDEBD2; color:#1E5A32}
.hb.go{background:#FFE08A; color:#5E4600}
.hb:disabled{opacity:.45; cursor:default}
.hhint{padding:2px 4px 6px; font-size:13px; color:var(--ink-soft); line-height:1.4}
#comp{transition:opacity .6s}
.walking #comp,.hospital #comp,.schooling #comp{opacity:0; pointer-events:none}
.hmeta small{color:var(--ink-soft); font-size:13px; line-height:1.35}
.hempty{padding:14px; text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.5}
.sub{margin:4px 0 0; font-family:var(--font-display); font-weight:400; font-size:18px}
.trk{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 14px; border:2px solid transparent; border-radius:18px; background:#F5F8FF; cursor:pointer}
.trk .tx{min-width:0; display:flex; flex-direction:column; gap:1px}
.trk .tn{font-family:var(--font-display); font-size:18px}
.trk .td{font-family:var(--font-body); font-size:13px; color:var(--ink-soft)}
.trk .tb{margin-left:auto; flex:none; font-family:var(--font-display); font-size:13px; color:#3F5BD0; display:none}
.trk.on{border-color:#6B86E8; background:#E8EEFF}
.trk.on .tb{display:inline}
.swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.swc{min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0 4px; border:2px solid transparent; border-radius:16px; background:#F5F8FF; cursor:pointer; font-family:var(--font-display); font-size:13px}
.swc i{display:block; width:34px; height:34px; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 2px 0 rgba(52,64,106,.18)}
.swc.on{border-color:#6B86E8; background:#E8EEFF}
.buy:disabled{background:#E7E9F2; color:#9AA2BE; cursor:default}

@media (prefers-reduced-motion:reduce){
  .breathe,.cloud,.stars circle,#docArm,#doc,.walking #strip{animation:none}
}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var NS = 'http://www.w3.org/2000/svg';
var KEY = 'elephant-game-v1';
var OX = 200, OY = 306;
var KEYS = ['hunger','thirst','clean','happy','energy'];
var MAXLV = 50;
/* Lv.20까지는 예전과 같은 곡선, 그 뒤로는 레벨당 경험치 70씩 */
function lvAt(L){ var k=Math.min(L,20)-1, v=Math.round(8*k+1.5*k*k); return L>20 ? v+(L-20)*70 : v; }
function stageName(L){ return L>=45?'전설의 코끼리':(L>=35?'슈퍼 코끼리':(L>=25?'대장 코끼리':(L>=15?'멋쟁이 코끼리':(L>=10?'개구쟁이 코끼리':(L>=5?'꼬마 코끼리':'아기 코끼리'))))); }
function lvScale(L){ return .64+.38*(Math.min(L,20)-1)/19; }
var FOODS = {
  banana:{hunger:22, happy:2,  xp:6, line:'바나나 냠냠, 달콤해요!'},
  melon: {hunger:28, thirst:10, happy:6,  xp:7, line:'수박이 시원하고 맛있어요!'},
  peanut:{hunger:14, thirst:-6, happy:10, xp:6, line:'땅콩은 고소해서 좋아요! 그런데 목말라요'},
  water: {thirst:40, happy:2, xp:4, drink:true, line:'꿀꺽꿀꺽, 시원해요!', full:'물은 이제 충분해요!'},
  broccoli:{dislike:true, line:'브로콜리는 싫어요! 퉤퉤'},
  carrot:  {dislike:true, line:'당근은 맛없어요! 안 먹을래요'},
  cabbage: {dislike:true, line:'양배추는 냄새가 이상해요!'}
};
var SHOP = [
  {id:'ribbon', name:'빨간 리본',   slot:'side', tier:0, cost:8,  vb:'370 46 135 90'},
  {id:'flower', name:'꽃 핀',       slot:'side', tier:0, cost:12, vb:'150 36 110 110'},
  {id:'glasses',name:'동그란 안경', slot:'face', tier:1, cost:15, vb:'130 170 380 140'},
  {id:'scarf',  name:'따뜻한 목도리',slot:'neck', tier:1, cost:20, vb:'185 330 270 150'},
  {id:'hat',    name:'파티 모자',   slot:'head', tier:1, cost:25, vb:'230 -70 180 160'},
  {id:'crown',  name:'반짝 왕관',   slot:'head', tier:2, cost:0,  vb:'220 -30 200 125'}
];
/* 이미지로 만든 아이템: {id,name,slot,tier,cost,file:'assets/items/id.webp',box:[x,y,w,h]} 를 여기에 추가하면
   뽑기·꾸미기·도감에 자동으로 들어가요. box는 캔버스(640x520) 좌표, vb는 box 와 같아요. */
var IMG_ITEMS = [];
var TIERS = [
  {name:'보통',     w:60, dup:4,  buy:true},
  {name:'희귀',     w:28, dup:6,  buy:true},
  {name:'레전더리', w:10, dup:8,  buy:false},
  {name:'시크릿',   w:2,  dup:10, buy:false}
];

var GACHA_COST=10;

var scene=$('scene'), fx=$('fx'), eleWrap=$('eleWrap'), hop=$('hop'), ele=$('ele'), bubble=$('bubble');
var tray=$('tray'), sleepLabel=$('sleepLabel');

/* ---------- 저장 ---------- */
function newId(){ return 'e'+Date.now().toString(36)+Math.floor(Math.random()*1679616).toString(36); }
function fresh(){
  return {v:1,name:'',xp:0,coins:20,hunger:70,thirst:75,clean:80,happy:70,energy:90,owned:[],worn:{},sleeping:false,sleepFrom:0,sick:false,sickT:0,sfxOn:true,sfxVol:.7,bgmOn:true,bgmVol:.5,bgmTrack:0,color:'blue',adj:{},herd:[],born:Date.now(),schoolDay:'',id:newId(),grad:0,t:Date.now()};
}
function load(){
  try{ var r=JSON.parse(localStorage.getItem(KEY)); if(r && r.v===1){ if(typeof r.thirst!=='number') r.thirst=75; if(typeof r.sick!=='boolean') r.sick=false; if(typeof r.sickT!=='number') r.sickT=0;
    if(typeof r.sfxOn!=='boolean') r.sfxOn=(r.sound!==false);
    if(typeof r.bgmOn!=='boolean') r.bgmOn=(r.sound!==false);
    if(typeof r.sfxVol!=='number') r.sfxVol=.7;
    if(typeof r.bgmVol!=='number') r.bgmVol=.5;
    if(typeof r.bgmTrack!=='number') r.bgmTrack=0;
    if(typeof r.color!=='string') r.color='blue';
    if(!r.adj || typeof r.adj!=='object') r.adj={};
    if(!Array.isArray(r.herd)) r.herd=[];
    if(typeof r.schoolDay!=='string') r.schoolDay='';
    if(typeof r.born!=='number') r.born=r.t||Date.now();
    if(typeof r.id!=='string') r.id=newId();
    if(typeof r.grad!=='number') r.grad=0;
    r.herd.forEach(function(h,i){
      if(typeof h.id!=='string') h.id='h'+i+(h.grad||Date.now()).toString(36);
      if(typeof h.xp!=='number') h.xp=lvAt(MAXLV);
      ['hunger','thirst','clean','happy'].forEach(function(k){ if(typeof h[k]!=='number') h[k]=70; });
      if(typeof h.energy!=='number') h.energy=80;
      if(!h.worn || typeof h.worn!=='object') h.worn={};
      if(!h.adj || typeof h.adj!=='object') h.adj={};
      if(typeof h.color!=='string') h.color='blue';
      if(typeof h.sleeping!=='boolean') h.sleeping=false;
      if(typeof h.sleepFrom!=='number') h.sleepFrom=0;
      if(typeof h.sick!=='boolean') h.sick=false;
      if(typeof h.sickT!=='number') h.sickT=0;
      if(typeof h.grad!=='number') h.grad=0;
      if(typeof h.born!=='number') h.born=h.grad||Date.now();
      h.onScreen=!!h.onScreen;
    });
    /* 만렙이 20이던 때 졸업한 코끼리는 졸업한 채로 둬요 */
    var MX=lvAt(MAXLV);
    r.herd.forEach(function(h){ if(h.grad>0 && h.xp<MX) h.xp=MX; });
    if(r.grad>0 && r.xp<MX) r.xp=MX;
    var n=0; r.herd.forEach(function(h){ if(h.onScreen){ if(n>=2 || h.xp<lvAt(MAXLV)) h.onScreen=false; else n++; } });
    return r; } }catch(e){}
  return fresh();
}
var S = load();
function save(){ try{ S.t=Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 도우미 ---------- */
function mk(tag, attrs, parent){
  var e=document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  (parent||fx).appendChild(e); return e;
}
var ACC_ORDER=['scarf','glasses','ribbon','flower','hat','crown'];
IMG_ITEMS.forEach(function(it){
  var b=it.box; it.vb=b.join(' '); SHOP.push(it); ACC_ORDER.push(it.id);
  var g=document.createElementNS(NS,'g'); g.id='g-'+it.id;
  var im=document.createElementNS(NS,'image');
  im.setAttribute('href',it.file); im.setAttribute('x',b[0]); im.setAttribute('y',b[1]); im.setAttribute('width',b[2]); im.setAttribute('height',b[3]);
  g.appendChild(im); $('g-crown').parentNode.appendChild(g);
  var u=document.createElementNS(NS,'use'); u.id='acc-'+it.id; u.setAttribute('href','#g-'+it.id); u.setAttribute('hidden','');
  $('acc-crown').parentNode.appendChild(u);
});
function rand(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function cl(v){ return Math.max(5, Math.min(100, v)); }
function show(el,on){ if(on) el.removeAttribute('hidden'); else el.setAttribute('hidden',''); }
function hasJong(w){ var c=w.charCodeAt(w.length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; }
function ga(w){ return w+(hasJong(w)?'이':'가'); }
function eun(w){ return w+(hasJong(w)?'은':'는'); }
function nm(){ return S.name||'코순이'; }
function level(){ var L=1; for(var j=2;j<=MAXLV;j++) if(S.xp>=lvAt(j)) L=j; return L; }
function sc(){ return lvScale(level()); }
function isNight(){ var h=new Date().getHours(); return S.sleeping || h>=19 || h<6; }
function done(anim){ return anim.finished.catch(function(){}); }

/* ---------- 소리 ---------- */
var ac=null, master=null, sfxBus=null, bgmBus=null;
function getAC(){
  if(ac) return ac;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  ac=new AC();
  var comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  master=ac.createGain(); master.gain.value=.9;
  sfxBus=ac.createGain(); bgmBus=ac.createGain();
  sfxBus.connect(master); bgmBus.connect(master); master.connect(comp); comp.connect(ac.destination);
  applyVolumes(true);
  return ac;
}
function applyVolumes(now){
  if(!ac) return;
  var t=ac.currentTime;
  var s=S.sfxOn ? S.sfxVol*S.sfxVol*2 : 0, b=S.bgmOn ? S.bgmVol*S.bgmVol*1.8 : 0;
  if(now){ sfxBus.gain.value=s; bgmBus.gain.value=b; }
  else{ sfxBus.gain.setTargetAtTime(s,t,.03); bgmBus.gain.setTargetAtTime(b,t,.05); }
}
function tone(f1,f2,dur,type,vol,delay){
  if(!S.sfxOn || S.sfxVol<=0) return;
  try{
    var c=getAC(); if(!c) return;
    if(c.state==='suspended') c.resume();
    var t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'triangle';
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.07,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
var sfx = {

function tickBy(sec){
  if(S.sleeping){ S.energy+=1.2*sec; S.hunger-=.01*sec; S.thirst-=.005*sec; S.clean-=.006*sec; S.happy-=.004*sec; }
  else{ S.hunger-=.02*sec; S.thirst-=.026*sec; S.clean-=.013*sec; S.happy-=.015*sec; S.energy-=.008*sec; }
  if(S.sick) S.happy-=.01*sec;
  KEYS.forEach(function(k){ S[k]=cl(S[k]); });
  var lowNow=(S.hunger<20||S.thirst<20||S.clean<20||S.happy<15), inc=Math.min(sec,20);
  if(!S.sick){
    S.sickT = lowNow ? (S.sickT||0)+inc : Math.max(0,(S.sickT||0)-inc*2);
    if(S.sickT>=150){ S.sick=true; S.sickT=0; }
  }
  if(S.sleeping && S.energy>=100) wake();
}
var last=S.t||Date.now();
function loop(){
  var now=Date.now(), dt=Math.min((now-last)/1000, 21600); last=now;
  if(dt>6) dt*=.25;
  var wasSick=S.sick;
  tickBy(dt);
  if(!wasSick && S.sick){ sfx.no(); say(ga(nm())+' 몸이 안 좋아요. 병원에 가요!', 4500); }
  commit();
}

/* ---------- 하트 줍기 ---------- */
function spawnHeart(x,y){
  if(x===undefined) x=rand(50,350);
  if(y===undefined) y=rand(70,230);
  var outer=mk('g',{transform:'translate('+x+' '+y+')'});
  var g=mk('g',{style:'cursor:pointer'},outer);
  mk('circle',{cx:0,cy:0,r:28,fill:'transparent'},g);
  mk('use',{href:'#i-heart',x:-17,y:-17,width:34,height:34},g);
  outer.animate([{opacity:0},{opacity:1}],{duration:250});
  var bob=g.animate([{transform:'translateY(0)'},{transform:'translateY(-9px)'}],{duration:rand(800,1100),direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
  var taken=false;
  g.addEventListener('pointerdown',function(e){
    e.stopPropagation();
    if(taken) return; taken=true; bob.cancel();
    S.coins+=1; S.happy=cl(S.happy+2); addXp(1); sfx.coin(); popCoin(); commit(); if(!S.sleeping && !flash) setFlash('joy',700);
    var t=mk('text',{x:0,y:-22,'text-anchor':'middle','font-size':20,fill:'#FFFFFF',stroke:'#D9A400','stroke-width':1,'font-family':'Jua, sans-serif'},outer);
    t.textContent='+1';
    t.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-26px)',opacity:0}],{duration:700,fill:'forwards'});
    done(g.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.7)',opacity:0}],{duration:300,fill:'forwards'})).then(function(){ g.remove(); });
    setTimeout(function(){ outer.remove(); },800);
  });
  setTimeout(function(){
    if(taken) return; taken=true;
    done(outer.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'})).then(function(){ outer.remove(); });
  },9000);
}

function renderShop(){
  var list=$('shopList'); list.innerHTML='';
  $('shopCoins').textContent=S.coins;
  if(!gBusy) renderGacha();
  SHOP.map(function(it,i){ return {it:it,i:i}; }).sort(function(a,b){ return (a.it.tier-b.it.tier)||(a.i-b.i); }).forEach(function(o){
    var it=o.it, owned=S.owned.indexOf(it.id)>=0, worn=S.worn[it.slot]===it.id, buyable=TIERS[it.tier].buy;
    if(!owned && it.tier===3) return;
    var row=document.createElement('div'); row.className='row'+((!owned&&!buyable)?' lockd':'');
    row.innerHTML='<svg class="prev" viewBox="'+it.vb+'" aria-hidden="true"><use href="#g-'+it.id+'"/></svg><div class="meta">'+it.name+'<span class="rar r'+it.tier+'">'+TIERS[it.tier].name+'</span></div>';
    var btn=document.createElement('button'); btn.className='buy';
    if(!owned && !buyable){
      btn.textContent='뽑기 전용'; btn.disabled=true;
    }else if(!owned){
      btn.innerHTML='<svg class="ico"><use href="#i-coin"/></svg>'+it.cost;
      btn.disabled=S.coins<it.cost;
      btn.addEventListener('click',function(){ buy(it); });
    }else{
      btn.textContent=worn?'벗기':'입히기'; if(worn) btn.classList.add('on');
      btn.addEventListener('click',function(){ wear(it); });
    }
    row.appendChild(btn); list.appendChild(row);
  });
}
/* ---------- 도감 / 새 코끼리 ---------- */
function accTf(it,a,oy){
  var v=it.vb.split(' ').map(Number), cx=v[0]+v[2]/2, cy=v[1]+v[3]/2;
  return 'translate('+a.x+' '+(a.y+(oy||0))+') translate('+cx+' '+cy+') scale('+a.s+') translate('+(-cx)+' '+(-cy)+')';
}
function thumbSvg(rec){
  var h='<svg viewBox="40 -80 560 600" aria-hidden="true"><image href="'+poseSrc(rec.color||'blue','idle')+'" x="0" y="0" width="640" height="520"/>';
  ACC_ORDER.forEach(function(id){
    var it=SHOP.filter(function(x){ return x.id===id; })[0];
    if(it && rec.worn && rec.worn[it.slot]===id) h+='<use href="#g-'+id+'" transform="'+accTf(it,adjOf(rec.adj,id),0)+'"/>';
  });
  return h+'</svg>';
}
function fmtDate(t){ var d=new Date(t); return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate(); }
function daysBetween(a,b){ return Math.max(1,Math.ceil((b-a)/86400000)); }
function curRec(){ return {name:nm(), color:S.color, worn:S.worn, adj:S.adj}; }
var ELE_KEYS=['id','name','xp','hunger','thirst','clean','happy','energy','worn','adj','color','sleeping','sleepFrom','sick','sickT','born','grad'];
function cp(v){ return (v&&typeof v==='object')?JSON.parse(JSON.stringify(v)):v; }
function packEle(){ var o={}; ELE_KEYS.forEach(function(k){ o[k]=cp(S[k]); }); o.onScreen=false; return o; }
function unpackEle(rec){ ELE_KEYS.forEach(function(k){ S[k]=cp(rec[k]); }); }
function levelOfXp(xp){ var L=1; for(var j=2;j<=MAXLV;j++) if(xp>=lvAt(j)) L=j; return L; }
function isMax(rec){ return levelOfXp(rec.xp)>=MAXLV; }
function screenCount(){ return S.herd.filter(function(h){ return h.onScreen; }).length; }

function toggleScreen(id){

  else{

  }
  save(); renderComp(); renderHerd();
  if(h.onScreen) say(ga(h.name)+' 놀러 왔어요!', 2800);

function continueWith(id){
  var i=-1; S.herd.forEach(function(x,k){ if(x.id===id) i=k; });

  endPet(); tray.hidden=true;
  var rec=S.herd.splice(i,1)[0];
  var old=packEle(); if(level()>=MAXLV && !old.grad) old.grad=Date.now();
  S.herd.push(old);
  unpackEle(rec); S.t=Date.now(); last=Date.now();
  if(zIv){ clearInterval(zIv); zIv=null; }
  if(S.sleeping) zIv=setInterval(zzz,1700);
  applyColor(); $('herdWrap').hidden=true; commit(); renderComp();
  sfx.up(); if(!S.sleeping){ setFlash('joy',2200); say(ga(nm())+' 돌아왔어요! 또 같이 놀아요', 3400); }
}

    await wait(1100); sfx.pop(); schoolBounce();

    say('숫자도 배워요', 2600); boardText('1 + 1 = 2'); schoolBounce();
    await wait(2800);
    say('참 잘했어요!', 3000); boardText('★ ★ ★'); sfx.up(); confetti(); setFlash('joy',2800);
    await wait(2600);
  }finally{
    if(st) clearInterval(st);
    if(bob) bob.cancel();
    scene.classList.remove('schooling');
    locked=false;
  }
  S.schoolDay=dayKey();
  S.happy=cl(S.happy+14); S.energy=cl(S.energy-12); S.hunger=cl(S.hunger-8); S.thirst=cl(S.thirst-8); S.clean=cl(S.clean-4); S.coins+=3; popCoin();
  addXp(12); sfx.coin();
  setFlash('joy',2400);
  say('학교 끝! 코인 3개를 받았어요', 3600);
  commit();
}

/* ---------- 병원 ---------- */
function flyTool(sym,x0,y0,x1,y1,ms){
  var g=mk('g',{}); mk('use',{href:'#'+sym,x:-26,y:-26,width:52,height:52},g);
  var a=g.animate([{transform:'translate('+x0+'px,'+y0+'px) scale(.8)'},{transform:'translate('+x1+'px,'+y1+'px) scale(1)'}],{duration:ms,easing:'ease-in-out',fill:'forwards'});
  return {g:g, done:done(a)};
}
function dropTool(g){ done(g.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'})).then(function(){ g.remove(); }); }
async function hospital(){
  if(locked || sleepingGuard()) return;
  tray.hidden=true;
  if(!S.sick){ say(nm()+'는 건강해요! 아프면 병원에 가요', 3200); return; }
  locked=true;
  try{
    var s=sc();
    say('병원에 가요. 걱정 마요', 2400); sfx.pop();
    scene.classList.add('hospital');
    await wait(1200);
    say('의사 선생님이 콩닥콩닥 들어 볼게요', 2800);
    var t1=flyTool('i-steth',300,236,OX-6*s,OY-72*s,900); await t1.done;
    sfx.beat(); hop.animate([{transform:'scale(1,1)'},{transform:'scale(1.03,.97)'},{transform:'scale(1,1)'},{transform:'scale(1.03,.97)'},{transform:'scale(1,1)'}],{duration:1000});
    await wait(1600); dropTool(t1.g);
    say('열도 재 볼게요', 2200);
    var t2=flyTool('i-thermo',300,236,OX+32*s,OY-106*s,900); await t2.done;
    await wait(1500); dropTool(t2.g);
    say('열이 조금 있네요. 약을 먹어요', 2800);
    var t3=flyTool('i-pill',300,236,OX+34*s,OY-100*s,900); await t3.done;
    sfx.drink(); setFlash('angry',1700); say('으엑, 써요!', 1800);
    await wait(1800); dropTool(t3.g);
    setFlash('joy',3200); sfx.up(); confetti();
    say('그래도 다 먹었어요. 참 잘했어요!', 3400);
    var sg=mk('g',{}); mk('use',{href:'#i-star',x:-22,y:-22,width:44,height:44},sg);
    done(sg.animate([{transform:'translate('+(OX+80*s)+'px,'+(OY-210*s)+'px) scale(0) rotate(-40deg)',opacity:1},{transform:'translate('+(OX+80*s)+'px,'+(OY-230*s)+'px) scale(1.3) rotate(10deg)',opacity:1,offset:.5},{transform:'translate('+(OX+80*s)+'px,'+(OY-250*s)+'px) scale(1) rotate(0deg)',opacity:0}],{duration:2200,fill:'forwards'})).then(function(){ sg.remove(); });
    await wait(2800);
    S.sick=false; S.sickT=0; S.happy=cl(S.happy+14); S.energy=cl(S.energy-6); S.coins+=2; addXp(6); popCoin(); commit();
    scene.classList.remove('hospital');
    await wait(1000);
    say('다 나았어요! 고마워요. 스티커로 코인 2개를 받았어요', 4200);
    commit();
  }finally{
    scene.classList.remove('hospital');
    locked=false;
  }
}

/* ---------- 몸 색깔 ---------- */
var COLORS=[
  {id:'blue',  name:'파랑', say:'파란색',  hex:'#B9C6EE'},
  {id:'pink',  name:'분홍', say:'분홍색',  hex:'#F5A3C2'},
  {id:'mint',  name:'민트', say:'민트색',  hex:'#A5E8CF'},
  {id:'yellow',name:'노랑', say:'노란색',  hex:'#FBE08A'},
  {id:'purple',name:'보라', say:'보라색',  hex:'#CDB4F2'},
  {id:'gray',  name:'회색', say:'회색',    hex:'#B9BEC9'}
];
var POSE_IDS=['idle','sad','sleep','eat','angry','joy','surprise'];
function poseSrc(color,p){ return 'assets/'+(color==='blue'?'':color+'/')+p+'.webp'; }
function applyColor(){
  POSE_IDS.forEach(function(p){
    var el=document.querySelector('.p-'+p); if(el) el.setAttribute('href', poseSrc(S.color,p));
  });
}
function renderColors(){
  var box=$('colorList'); box.innerHTML='';
  COLORS.forEach(function(c){
    var b=document.createElement('button'); b.className='swc'+(S.color===c.id?' on':'');
    b.setAttribute('aria-label',c.name+' 코끼리'); b.setAttribute('aria-pressed', S.color===c.id ? 'true' : 'false');
    b.innerHTML='<i style="--c:'+c.hex+'"></i>'+c.name;
    b.addEventListener('click',function(){ setColor(c); });
    box.appendChild(b);
  });
}
function setColor(c){
  if(S.color===c.id) return;
  S.color=c.id; renderColors();
  var loads=POSE_IDS.map(function(p){ return new Promise(function(res){ var im=new Image(); im.onload=res; im.onerror=res; im.src=poseSrc(c.id,p); }); });
  Promise.race([Promise.all(loads), wait(2000)]).then(function(){
    applyColor(); commit();
    sfx.up();
    say(ga(nm())+' '+c.say+'으로'+' 바뀌었어요!', 3000);
    setFlash('joy',1800);
    hop.animate([{transform:'translateY(0)'},{transform:'translateY(-18px)'},{transform:'translateY(0)'}],{duration:500,easing:'ease-out'});
  });
}

  openName(true);

setInterval(function(){
  if(S.sleeping || locked || editing || bubble.classList.contains('show') || $('nameWrap').hidden===false) return;
  var n=nm();
  if(S.sick) say(ga(n)+' 아파요... 병원에 가고 싶어요');
  else if(S.hunger<35) say(ga(n)+' 배가 고파요. 맛있는 거 주세요!');
  else if(S.thirst<35) say(ga(n)+' 목말라요. 물 주세요!');
  else if(S.clean<35) say('몸이 끈적끈적해요. 씻고 싶어요');
  else if(S.happy<35) say('심심해요. 같이 놀아요!');
  else if(S.energy<25) say('졸려요... 자고 싶어요');
  else say(pick(['오늘도 만나서 반가워요','저를 콕 눌러 보세요!','바나나가 제일 좋아요','나는 점점 크고 있어요','하트를 모으면 예쁜 걸 살 수 있어요']));
},18000);
})();
